name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'packages/shared/**'
      - 'apps/api/src/types/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
      CORS_ORIGIN: ${{ format('https://{0}.github.io', github.repository_owner) }}
      DSR_TEMPLATE_BUCKET: ${{ vars.DSR_TEMPLATE_BUCKET || 'templates' }}
      DSR_TEMPLATE_OBJECT_PATH: ${{ vars.DSR_TEMPLATE_OBJECT_PATH || 'Hub_DSR_Template.xlsx' }}
      AUTH_TOKEN_TTL_HOURS: ${{ vars.AUTH_TOKEN_TTL_HOURS || '12' }}
      BOOTSTRAP_ADMIN_USERNAME: ${{ vars.BOOTSTRAP_ADMIN_USERNAME || 'admin' }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD || 'admin123' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$AUTH_TOKEN_SECRET" || { echo "Missing AUTH_TOKEN_SECRET"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        run: supabase db push --linked --yes

      - name: Sync function secrets
        run: supabase secrets set CORS_ORIGIN="$CORS_ORIGIN" DSR_TEMPLATE_BUCKET="$DSR_TEMPLATE_BUCKET" DSR_TEMPLATE_OBJECT_PATH="$DSR_TEMPLATE_OBJECT_PATH" AUTH_TOKEN_SECRET="$AUTH_TOKEN_SECRET" AUTH_TOKEN_TTL_HOURS="$AUTH_TOKEN_TTL_HOURS" BOOTSTRAP_ADMIN_USERNAME="$BOOTSTRAP_ADMIN_USERNAME" BOOTSTRAP_ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" --project-ref "$PROJECT_REF"

      - name: Deploy edge functions
        run: |
          supabase functions deploy api --project-ref "$PROJECT_REF"
          supabase functions deploy employees-list --project-ref "$PROJECT_REF"
          supabase functions deploy dsr --project-ref "$PROJECT_REF"
          supabase functions deploy dsr-export-month --project-ref "$PROJECT_REF"
          supabase functions deploy purge-old-dsrs --project-ref "$PROJECT_REF"
