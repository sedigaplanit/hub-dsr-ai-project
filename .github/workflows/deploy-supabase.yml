name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'packages/shared/**'
      - 'apps/api/src/types/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CORS_ORIGIN: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      DSR_TEMPLATE_BUCKET: ${{ vars.DSR_TEMPLATE_BUCKET || 'templates' }}
      DSR_TEMPLATE_OBJECT_PATH: ${{ vars.DSR_TEMPLATE_OBJECT_PATH || 'Hub_DSR_Template.xlsx' }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        run: supabase db push --linked

      - name: Sync function secrets
        run: supabase secrets set CORS_ORIGIN="$CORS_ORIGIN" DSR_TEMPLATE_BUCKET="$DSR_TEMPLATE_BUCKET" DSR_TEMPLATE_OBJECT_PATH="$DSR_TEMPLATE_OBJECT_PATH" --project-ref "$PROJECT_REF"

      - name: Deploy edge functions
        run: |
          supabase functions deploy employees-list --project-ref "$PROJECT_REF"
          supabase functions deploy dsr --project-ref "$PROJECT_REF"
          supabase functions deploy dsr-export-month --project-ref "$PROJECT_REF"
          supabase functions deploy purge-old-dsrs --project-ref "$PROJECT_REF"
